name: Native desktop release qualification
on:
  workflow_dispatch:
  push:
    branches: ['release/**']
permissions:
  contents: read
jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Linux native widget prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev pkg-config xvfb
      - name: Build self-hosted native SDK
        run: |
          mkdir -p .build/release-evidence
          set -o pipefail
          make native-sdk 2>&1 | tee .build/release-evidence/bootstrap.log
      - name: Core regressions
        run: |
          set -o pipefail
          make native-test 2>&1 | tee .build/release-evidence/core.log
      - name: API contracts and byte safety
        run: |
          set -o pipefail
          make native-api-test 2>&1 | tee .build/release-evidence/api.log
      - name: Linux native widget state and events
        if: runner.os == 'Linux'
        run: |
          set -o pipefail
          xvfb-run -a sh native/tests/gui.sh 2>&1 | tee .build/release-evidence/gui.log
      - name: macOS native widget state and events
        if: runner.os == 'macOS'
        run: |
          set -o pipefail
          sh native/tests/gui.sh 2>&1 | tee .build/release-evidence/gui.log
      - name: Package tested SDK
        run: |
          set -o pipefail
          make native-distribution-test 2>&1 | tee .build/release-evidence/distribution.log
          sh native/bootstrap/package.sh | tee .build/release-evidence/archive.txt
      - uses: actions/upload-artifact@v4
        with:
          name: native-sdk-${{ matrix.os }}
          path: artifacts/arya-native-*.tar.gz*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}
          path: .build/release-evidence/
  windows-cygwin:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - run: git config --global core.autocrlf input
      - uses: actions/checkout@v4
      - uses: cygwin/cygwin-install-action@5a1b0cd107181fa6bb6bf3f90d500f4fb3132f18 # v7
        with:
          install-dir: 'C:\cygwin'
          packages: >-
            gcc-core gcc-g++ make perl libcrypt-devel libiconv-devel
            pkg-config zip unzip diffutils patch tar gzip bzip2 xz coreutils python3
      - name: Direct Win32 backend action probe
        shell: C:\cygwin\bin\bash.exe --noprofile --norc -eo pipefail '{0}'
        run: |
          make native-gui CC=gcc
          gcc -std=c11 native/gui/platform-test.c -lcomctl32 -lgdi32 -luser32 -o .build/gui/platform-actions.exe
          .build/gui/platform-actions.exe
      - name: Build native Windows PE toolchain with explicit Cygwin dependency
        shell: C:\cygwin\bin\bash.exe --noprofile --norc -eo pipefail '{0}'
        run: |
          mkdir -p .build/release-evidence
          make native-sdk CC=gcc CXX=g++ 2>&1 | tee .build/release-evidence/windows-bootstrap.log
      - name: Core and Win32 widget checks
        shell: C:\cygwin\bin\bash.exe --noprofile --norc -eo pipefail '{0}'
        run: sh native/bootstrap/windows-runtime-test.sh
      - name: Native Windows editor paths and protocol
        shell: pwsh
        run: |
          $env:PATH = "C:\cygwin\bin;" + $env:PATH
          node native/tests/windows-editor-reference.cjs "$env:GITHUB_WORKSPACE\.build\independent\arya.exe"
      - name: Package and relocate the tested Windows Cygwin SDK
        shell: C:\cygwin\bin\bash.exe --noprofile --norc -eo pipefail '{0}'
        run: sh native/bootstrap/windows-sdk-test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: native-sdk-windows-cygwin-x64
          path: artifacts/arya-native-*-windows-cygwin-x64.tar.gz*
      - name: Record dependency requirements
        shell: C:\cygwin\bin\bash.exe --noprofile --norc -eo pipefail '{0}'
        run: |
          mkdir -p .build/release-evidence
          cygcheck .build/independent/arya.exe > .build/release-evidence/windows-dependencies.txt
          .build/independent/arya --version
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-cygwin-evidence
          path: .build/release-evidence/
