name: Native desktop release qualification
on:
  workflow_dispatch:
    inputs:
      target:
        description: Platform to qualify
        type: choice
        default: all
        options: [all, linux, macos, windows]
      windows_bootstrap_run:
        description: Optional original run ID for exact Windows bootstrap reuse (target windows only)
        type: string
      windows_bootstrap_sha:
        description: Exact 40-character source SHA of that bootstrap run
        type: string
      windows_bootstrap_artifact:
        description: Immutable windows-bootstrap-sdk-unqualified artifact ID
        type: string
  push:
    branches: ['release/**']
permissions:
  contents: read
  actions: read
jobs:
  unix:
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'windows'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.target == 'linux' && '["ubuntu-24.04"]' || github.event_name == 'workflow_dispatch' && inputs.target == 'macos' && '["macos-15"]' || '["ubuntu-24.04","macos-15"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Linux native widget prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev pkg-config xvfb
      - name: Build self-hosted native SDK
        run: |
          mkdir -p .build/release-evidence
          set -o pipefail
          make native-sdk 2>&1 | tee .build/release-evidence/bootstrap.log
      - name: Core regressions
        run: |
          set -o pipefail
          make native-test 2>&1 | tee .build/release-evidence/core.log
      - name: API contracts and byte safety
        run: |
          set -o pipefail
          make native-api-test 2>&1 | tee .build/release-evidence/api.log
      - name: Linux native widget state and events
        if: runner.os == 'Linux'
        run: |
          set -o pipefail
          xvfb-run -a sh native/tests/gui.sh 2>&1 | tee .build/release-evidence/gui.log
      - name: macOS native widget state and events
        if: runner.os == 'macOS'
        run: |
          set -o pipefail
          sh native/tests/gui.sh 2>&1 | tee .build/release-evidence/gui.log
      - name: Package tested SDK
        run: |
          set -o pipefail
          make native-distribution-test 2>&1 | tee .build/release-evidence/distribution.log
          sh native/bootstrap/package.sh | tee .build/release-evidence/archive.txt
      - uses: actions/upload-artifact@v4
        with:
          name: native-sdk-${{ matrix.os }}
          path: artifacts/arya-native-*.tar.gz*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}
          path: .build/release-evidence/
  windows-cygwin:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'windows'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      BOOTSTRAP_RUN: ${{ inputs.windows_bootstrap_run }}
      BOOTSTRAP_SHA: ${{ inputs.windows_bootstrap_sha }}
      BOOTSTRAP_ARTIFACT: ${{ inputs.windows_bootstrap_artifact }}
      QUALIFICATION_TARGET: ${{ inputs.target }}
    steps:
      - run: git config --global core.autocrlf input
      - uses: actions/checkout@v4
      - uses: cygwin/cygwin-install-action@5a1b0cd107181fa6bb6bf3f90d500f4fb3132f18 # v7
        with:
          install-dir: 'C:\cygwin'
          packages: >-
            gcc-core gcc-g++ make perl libcrypt-devel libiconv-devel
            pkg-config zip unzip diffutils patch tar gzip bzip2 xz coreutils python3
      - name: Validate bootstrap reuse inputs
        shell: C:\cygwin\bin\bash.exe --noprofile --norc -o igncr -eo pipefail '{0}'
        run: |
          if test -n "$BOOTSTRAP_RUN$BOOTSTRAP_SHA$BOOTSTRAP_ARTIFACT"; then
            test "$QUALIFICATION_TARGET" = windows
            test -n "$BOOTSTRAP_RUN" && test -n "$BOOTSTRAP_SHA" && test -n "$BOOTSTRAP_ARTIFACT"
          fi
          python3 native/tests/windows-bootstrap-reference.py
      - name: Empty-PATH native compiler and DLL loading
        shell: C:\cygwin\bin\bash.exe --noprofile --norc -o igncr -eo pipefail '{0}'
        run: sh native/bootstrap/windows-path-test.sh
      - name: Direct Win32 backend action probe
        shell: C:\cygwin\bin\bash.exe --noprofile --norc -o igncr -eo pipefail '{0}'
        run: |
          mkdir -p .build/release-evidence
          make native-gui CC=gcc
          gcc -std=c11 native/gui/platform-test.c -lcomctl32 -lgdi32 -luser32 -o .build/gui/platform-actions.exe
          .build/gui/platform-actions.exe 2>&1 | tee .build/release-evidence/windows-native-actions.log
      - name: Build native Windows PE toolchain with explicit Cygwin dependency
        id: bootstrap
        if: env.BOOTSTRAP_ARTIFACT == ''
        shell: C:\cygwin\bin\bash.exe --noprofile --norc -o igncr -eo pipefail '{0}'
        run: |
          mkdir -p .build/release-evidence
          make native-sdk CC=gcc CXX=g++ 2>&1 | tee .build/release-evidence/windows-bootstrap.log
      - name: Preserve unqualified Windows bootstrap SDK
        id: capture
        if: steps.bootstrap.outcome == 'success'
        shell: C:\cygwin\bin\bash.exe --noprofile --norc -o igncr -eo pipefail '{0}'
        run: python3 native/bootstrap/windows-bootstrap-artifact.py capture
      - uses: actions/upload-artifact@v4
        if: always() && steps.capture.outcome == 'success'
        with:
          name: windows-bootstrap-sdk-unqualified
          path: .build/windows-bootstrap-capture/windows-bootstrap-sdk.tar.gz*
          if-no-files-found: error
          retention-days: 14
      - name: Restore verified Windows bootstrap bytes for current gates
        if: env.BOOTSTRAP_ARTIFACT != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: C:\cygwin\bin\bash.exe --noprofile --norc -o igncr -eo pipefail '{0}'
        run: >-
          python3 native/bootstrap/windows-bootstrap-artifact.py restore
          --run "$BOOTSTRAP_RUN" --sha "$BOOTSTRAP_SHA" --artifact "$BOOTSTRAP_ARTIFACT"
      - name: Core and Win32 widget checks
        shell: C:\cygwin\bin\bash.exe --noprofile --norc -o igncr -eo pipefail '{0}'
        run: sh native/bootstrap/windows-runtime-test.sh
      - name: Native Windows editor paths and protocol
        shell: pwsh
        run: |
          $env:PATH = "C:\cygwin\bin;" + $env:PATH
          node native/tests/windows-editor-reference.cjs "$env:GITHUB_WORKSPACE\.build\independent\arya.exe"
      - name: Package and relocate the tested Windows Cygwin SDK
        shell: C:\cygwin\bin\bash.exe --noprofile --norc -o igncr -eo pipefail '{0}'
        run: sh native/bootstrap/windows-sdk-test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: native-sdk-windows-cygwin-x64
          path: artifacts/arya-native-*-windows-cygwin-x64.tar.gz*
      - name: Record dependency requirements
        shell: C:\cygwin\bin\bash.exe --noprofile --norc -o igncr -eo pipefail '{0}'
        run: |
          mkdir -p .build/release-evidence
          cygcheck .build/independent/arya.exe > .build/release-evidence/windows-dependencies.txt
          .build/independent/arya --version
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-cygwin-evidence
          path: .build/release-evidence/
