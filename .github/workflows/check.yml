name: Language, modules, interoperability, and package qualification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.15.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - name: Run the complete language suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/evidence
          node --version > artifacts/evidence/runtime.txt
          python --version >> artifacts/evidence/runtime.txt
          npm run check 2>&1 | tee artifacts/evidence/check.log
      - name: Pack the checked compiler
        run: npm pack --ignore-scripts --pack-destination artifacts
      - name: Verify installation and mapped traces outside the checkout
        shell: bash
        run: |
          set -o pipefail
          npm run test:package 2>&1 | tee artifacts/evidence/package.log
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-${{ matrix.os }}-node-${{ matrix.node }}
          path: artifacts/evidence
          if-no-files-found: warn
